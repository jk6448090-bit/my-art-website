    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            padding: 25px;
            width: 350px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea, button {
            width: 100%;
            margin-top: 5px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #333;
            color: #fff;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="index.html">Home</a>

    </nav>
    <h1>Sign Up for Painting Classes</h1>
</header>
<main>
<body>
<form action="thankyou.html" method="get">
<div class="container">
    <h2>Painting Class Registration</h2>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number">

        <label class="classes">Class Level</label>
        <select>
            <option class="card">Beginner</option>
            <option class="card">Intermediate</option>
            <option class="card">Advanced</option>
        </select>

        <label>Message</label>
        <textarea rows="3" placeholder="Why do you want to join?"></textarea>

        <button type="submit">Register</button>
    </form>
</div>
</main>

<footer>
